[credentials]
ollama_api_key = YOUR_OLLAMA_API_KEY_HERE

[models]
ollama_model = gpt-oss:120b-cloud

[settings]
language = arabic
# Choose: translate or summary
type = summary
# Number of posts to keep per feed (default: 20)
max_posts = 20
# Merge all feeds into one XML file: yes or no
merge_feeds = yes
